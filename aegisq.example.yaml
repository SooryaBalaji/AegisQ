# AegisQ configuration. Secrets never go here: use the environment
#   AEGISQ_API_TOKENS="alice:<token>,bob:<token>"   dashboard/API identities (>= 16 chars each)
#   AEGISQ_AUDIT_KEY="<random>"                    HMAC key for the audit hash chain
#   ANTHROPIC_API_KEY="<key>"                       enables the Claude planner
#   QISKIT_IBM_TOKEN / QISKIT_IBM_INSTANCE          IBM Quantum hardware for the entropy module
home: .aegisq

risk:
  z_years: 10                  # default position of the dashboard slider
  default_retention_years: 10  # X for categories not listed below
  data_categories:             # X: years the data must stay secret (set from your retention policy)
    health: 25
    payments: 7
    marketing: 1
  migration_years:             # Y: years to migrate, by what the scan found
    classical: 0.5
    classical_modern_stack: 0.1
    classical_old_stack: 1.5
    tls12_only: 2
    legacy_tls: 3
    plaintext: 3
    ssh_classical: 1

scan:
  timeout: 5
  concurrency: 50
  legacy_protocols: true
  scope:
    allow: []                  # e.g. ["10.0.0.0/8", ".corp.example.com"]; empty = anything not denied
    deny: []

agent:
  model: claude-opus-5-5          # --planner claude (needs ANTHROPIC_API_KEY)
  local_model: gemma-4-31b-it     # --planner local; with Ollama use the name `ollama list` shows
  # local_base_url: http://127.0.0.1:11434/v1   # default: Gemini API if GEMINI_API_KEY is set, else Ollama
  effort: high
  max_turns: 80
  approval_timeout_s: 1800     # how long request_approval waits for a human
  approval_ttl_s: 3600         # an approval must be used within this time
  require_classical_fallback: true
  min_tls_version: TLSv1.2
  verify_attempts: 5
  verify_interval_s: 1

server:
  host: 127.0.0.1
  port: 8000
