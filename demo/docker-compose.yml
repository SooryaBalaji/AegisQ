# AegisQ demo fleet. Every port is bound to 127.0.0.1: the agent only ever changes servers the team owns.
name: aegisq-demo

x-nginx: &nginx
  restart: unless-stopped
  depends_on:
    setup: { condition: service_completed_successfully }
  healthcheck:
    test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1 || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 3

x-aegisq: &aegisq
  build: { context: .., target: demo, args: { EXTRAS: "agent,quantum" } }
  image: aegisq:demo
  working_dir: /demo
  environment:
    AEGISQ_HOME: /var/lib/aegisq/workspace
    # Dashboard login. Override in a .env file next to this compose file: AEGISQ_API_TOKENS=you:<16+ chars>
    AEGISQ_API_TOKENS: ${AEGISQ_API_TOKENS:-admin:aegisq-demo-token-change-me}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}        # --planner claude
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}              # --planner local with Gemma 4 on the Gemini API
    # --planner local with Ollama/LM Studio on the host: AEGISQ_LLM_BASE_URL=http://host.docker.internal:11434/v1
    AEGISQ_LLM_BASE_URL: ${AEGISQ_LLM_BASE_URL:-}
    AEGISQ_LLM_MODEL: ${AEGISQ_LLM_MODEL:-}
    AEGISQ_LLM_API_KEY: ${AEGISQ_LLM_API_KEY:-}
    QISKIT_IBM_TOKEN: ${QISKIT_IBM_TOKEN:-}
  extra_hosts: ["host.docker.internal:host-gateway"]  # reach a model server on the host (Linux; built in on Docker Desktop)
  volumes:
    - aegisq-data:/var/lib/aegisq/workspace
    - ./:/demo                                       # inventory + nginx configs the agent patches
    - /var/run/docker.sock:/var/run/docker.sock      # lets the agent run nginx -t / reload in the demo containers
  depends_on:
    setup: { condition: service_completed_successfully }
    app-modern: { condition: service_started }

services:
  app-modern:            # nginx 1.29 + OpenSSL 3.5: the patch works
    <<: *nginx
    image: nginx:1.29-alpine
    container_name: aegisq-app-modern
    ports: ["127.0.0.1:8443:443"]
    volumes:
      - ./fleet/app-modern/conf.d:/etc/nginx/conf.d      # mount the directory: atomic config swaps stay visible
      - ./fleet/certs:/etc/nginx/certs:ro

  app-legacy:            # nginx 1.25 + OpenSSL 3.0: the planned failure
    <<: *nginx
    image: nginx:1.25-bookworm
    container_name: aegisq-app-legacy
    ports: ["127.0.0.1:8444:443"]
    volumes:
      - ./fleet/app-legacy/conf.d:/etc/nginx/conf.d
      - ./fleet/certs:/etc/nginx/certs:ro

  app-tls12:             # modern library, TLS 1.3 disabled
    <<: *nginx
    image: nginx:1.29-alpine
    container_name: aegisq-app-tls12
    ports: ["127.0.0.1:8445:443"]
    volumes:
      - ./fleet/app-tls12/conf.d:/etc/nginx/conf.d
      - ./fleet/certs:/etc/nginx/certs:ro

  app-ready:             # already hybrid ML-KEM
    <<: *nginx
    image: nginx:1.29-alpine
    container_name: aegisq-app-ready
    ports: ["127.0.0.1:8446:443"]
    volumes:
      - ./fleet/app-ready/conf.d:/etc/nginx/conf.d
      - ./fleet/certs:/etc/nginx/certs:ro

  app-plain:             # plaintext HTTP
    <<: *nginx
    image: nginx:1.29-alpine
    container_name: aegisq-app-plain
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./fleet/app-plain/conf.d:/etc/nginx/conf.d

  ssh-pq:                # OpenSSH 10.x: mlkem768x25519-sha256 by default
    build: ./images/sshd
    image: aegisq-demo/sshd:latest
    container_name: aegisq-ssh-pq
    restart: unless-stopped
    ports: ["127.0.0.1:2222:22"]

  ssh-legacy:            # same server, classical key exchange only
    image: aegisq-demo/sshd:latest   # built locally by ssh-pq; never pulled from a registry
    pull_policy: never
    container_name: aegisq-ssh-legacy
    restart: unless-stopped
    depends_on: [ssh-pq]
    command: ["/usr/sbin/sshd", "-D", "-e", "-o", "KexAlgorithms=curve25519-sha256,diffie-hellman-group14-sha1"]
    ports: ["127.0.0.1:2223:22"]

  # ------------------------------------------------------------------ AegisQ itself
  setup:                 # one-shot: writes nginx configs + demo certificates if they are missing
    <<: *aegisq
    container_name: aegisq-setup
    entrypoint: ["/opt/aegisq/bin/python", "/demo/setup.py", "--if-missing"]
    restart: "no"
    depends_on: []

  aegisq:                # dashboard on http://localhost:8000; also the image for `docker compose run --rm aegisq ...`
    <<: *aegisq
    container_name: aegisq-dashboard
    command: ["serve", "--host", "0.0.0.0", "--port", "8000", "--inventory", "/demo/fleet.docker.yaml"]
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped

  tests:                 # docker compose -f demo/docker-compose.yml --profile test run --rm tests [-m integration]
    <<: *aegisq
    profiles: ["test"]
    build: { context: .., target: test, args: { EXTRAS: "agent,quantum" } }
    image: aegisq:test
    container_name: aegisq-tests
    entrypoint: ["python3", "-m", "pytest"]
    command: []
    working_dir: /src
    environment:
      AEGISQ_FLEET: fleet.docker.yaml
    volumes:
      - ./:/src/demo
      - /var/run/docker.sock:/var/run/docker.sock
    restart: "no"
    depends_on: []

volumes:
  aegisq-data:           # the AegisQ workspace (scans, approvals, audit log, reports), shared by every aegisq container
