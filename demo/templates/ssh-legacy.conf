# ssh-legacy: OpenSSH 10.x restricted to classical key exchange (one of them SHA-1). Starts classical-only.
# AegisQ may change only the KexAlgorithms line below.
Port 22
KexAlgorithms curve25519-sha256,diffie-hellman-group14-sha1
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
X11Forwarding no
