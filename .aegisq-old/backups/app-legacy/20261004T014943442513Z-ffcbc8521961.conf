# app-legacy: nginx 1.25 on Debian bookworm, linked against OpenSSL 3.0 (no ML-KEM).
# The agent's patch is expected to fail `nginx -t` here and be rolled back.
server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1;

    location / { return 200 "app-legacy ok\n"; }
}
